<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgililer Günü Sürprizi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
    font-family: 'Georgia', serif;
    color: #ffffff;
    overflow-x: hidden;
}

#loginScreen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 40px;
    border-radius: 15px;
    text-align: center;
}

#mainContent { display: none; }

.heart {
    position: fixed;
    top: -10vh;
    width: 20px;
    height: 20px;
    background: white;
    transform: rotate(45deg);
    animation: fall linear infinite;
}

@keyframes fall {
    100% { transform: translateY(110vh) rotate(45deg); }
}
</style>
</head>

<body>

<!-- 🔥 AUDIO -->
<audio id="bgMusic" preload="auto" loop>
    <source src="Rei6.mp3" type="audio/mpeg">
</audio>

<div id="loginScreen">
    <div class="login-box">
        <h2>Sadece Bize Özel ❤️</h2>
        <input type="password" id="passwordInput" placeholder="Şifre...">
        <br><br>
        <button onclick="startSite()">Kilidi Aç</button>
        <p id="errorMessage" style="display:none;color:red;">Hatalı şifre</p>
    </div>
</div>

<div id="mainContent">
    <h1 id="typewriterText"></h1>
</div>

<script>

function startSite() {
    const pass = document.getElementById("passwordInput").value;
    const music = document.getElementById("bgMusic");

    if (pass === "1805") {

        // 🔥 MÜZİĞİ %100 BAŞLAT
        music.load();
        music.volume = 0.5;

        const playPromise = music.play();
        if (playPromise !== undefined) {
            playPromise.catch(() => {});
        }

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";

        startAnimations();

    } else {
        document.getElementById("errorMessage").style.display = "block";
    }
}

function startAnimations() {
    const text = "Seninle geçen her saniye çok güzel ❤️";
    let i = 0;

    function yaz() {
        if (i < text.length) {
            document.getElementById("typewriterText").innerHTML += text.charAt(i);
            i++;
            setTimeout(yaz, 50);
        }
    }

    yaz();

    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = "5s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
    }, 300);
}

</script>

</body>
</html>
